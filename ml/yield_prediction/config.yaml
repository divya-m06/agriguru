seed: 42

data:
  filename: "yield_df.csv"
  default_url: "https://raw.githubusercontent.com/Faissal-00/Crop-Yield-Prediction/master/yield_df.csv"
  drop_columns:
    - "Unnamed: 0"
  target: "hg/ha_yield"
  features_variant_a:
    - "Item"
    - "Year"
    - "average_rain_fall_mm_per_year"
    - "pesticides_tonnes"
    - "avg_temp"
  features_variant_b:
    - "Area"
    - "Item"
    - "Year"
    - "average_rain_fall_mm_per_year"
    - "pesticides_tonnes"
    - "avg_temp"

split:
  train_years_range: [1990, 2008]
  val_years_range: [2009, 2010]
  test_years_range: [2011, 2013]

transformations:
  target_log1p: true
  pesticides_log1p: true

features:
  run_ablation: true
  use_rainfall_x_temp: false
  use_climate_anomaly: false
  include_year: true

cv:
  expanding_window_n_splits: 4
  group_kfold_n_splits: 5

tuning:
  n_iter: 20
  random_state: 42
  n_jobs: -1

paths:
  data_dir: "data/yield_prediction"
  artifacts_dir: "artifacts/yield_prediction"
  reports_dir: "reports/yield_prediction"
